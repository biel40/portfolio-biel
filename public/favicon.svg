<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="mono" x1="4" y1="4" x2="124" y2="124" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#000d8a" />
            <stop offset="1" stop-color="#fa6e22" />
        </linearGradient>
    </defs>
    <!-- light badge matching the site's main background -->
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#FBF9F1" />
    <!-- "GB" monogram, tight kerning -->
    <text x="58" y="83" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="-3" fill="url(#mono)">GB</text>
    <!-- accent dot: "GB." flourish -->
    <rect x="89" y="85" width="10" height="10" rx="2" fill="#fa6e22" />
</svg>
